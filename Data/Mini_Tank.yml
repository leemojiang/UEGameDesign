Object:
  class: BP_Tank
  name: Tank_01

  transform:
    location: [0, 0, 100]

  properties:
    MaxHealth: 300
    Team: Blue

  components:
    - type: SceneComponent
      name: Root
      # is_root: true

    - type: StaticMeshComponent
      name: BodyMesh
      attach_to: Root
      properties:
        mesh: "/Game/Tank/Meshes/TankBody"

    - type: ChaosWheeledVehicleMovementComponent
      name: VehicleMovement
      attach_to: Root
      properties:
        max_engine_rpm: 5700
        engine_torque_curve:
          - [0, 400]
          - [2000, 500]
          - [5700, 400]
        differential_type: LimitedSlip_4W
        wheel_setups:
          - bone_name: Wheel_FL
            wheel_class: BP_TankWheel
          - bone_name: Wheel_FR
            wheel_class: BP_TankWheel
          - bone_name: Wheel_RL
            wheel_class: BP_TankWheel
          - bone_name: Wheel_RR
            wheel_class: BP_TankWheel

    - type: SpringArmComponent
      name: SpringArm
      attach_to: BodyMesh
      properties:
        target_arm_length: 500

    - type: CameraComponent
      name: Camera
      attach_to: SpringArm
