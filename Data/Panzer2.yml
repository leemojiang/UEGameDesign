Object:
  class: ChaosVehicleWheel
  name: Panzer2_Wheel_Middle
  properties:
    Offset: [0, 0, 0]
    WheelRadius: 70.0
    WheelWidth: 40.0
    WheelMass: 100.0
    SlipThreshold: 1000
    SkidThreshold: 1000

    bAffectedByBrake: True
    bAffectedByHandbrake: True
    bAffectedByEngine: True
    bABSEnabled: True

    SuspensionMaxRaise: 5
    SuspensionMaxDrop: 5
    SuspensionDampingRatio: 0.5
    SpringRate: 15000
    SpringPreload: 50
    SuspensionSmoothing: 0.5
---
